[project]
name = "open-outdoor-data"
version = "0.1.0"
requires-python = "==3.15.1"
dependencies = []

[dependency-groups]
geometry = ["numpy==2.5.4", "pyproj==3.8.0", "shapely==2.2.0"]
gis = [{include-group = "geometry"}, "pyogrio==0.13.0", "pyshp==3.1.6"]
loader = [{include-group = "geometry"}, "mapbox-vector-tile==2.2.0", "pmtiles==3.8.1"]

[project.scripts]
open-outdoor-data = "open_outdoor_data.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/open_outdoor_data"]
