[project]
name = "open-outdoor-data"
version = "0.1.0"
requires-python = "==3.13.14"
dependencies = []

[dependency-groups]
geometry = ["numpy==2.3.3", "pyproj==3.7.2", "shapely==2.1.2"]
gis = [{include-group = "geometry"}, "pyogrio==0.11.1", "pyshp==2.3.1"]
loader = [{include-group = "geometry"}, "mapbox-vector-tile==2.2.0", "pmtiles==3.7.0"]

[project.scripts]
open-outdoor-data = "open_outdoor_data.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/open_outdoor_data"]
