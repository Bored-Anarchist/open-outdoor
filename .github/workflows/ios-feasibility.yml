name: macos-ios-build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ios:
    name: macos-ios-build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Select and verify pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1s/Xcode //p')" = '26.4.1'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24.19.0 }
      - shell: bash
        run: npm install --global pnpm@11.20.0
      - shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build unsigned device application
        shell: bash
        run: pwsh -NoProfile -File scripts/Build-IosUnsigned.ps1
      - name: Package unsigned application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          app="$(find dist/ios-derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          cp -R "$app" dist/Payload/
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/OpenOutdoor-unsigned.ipa
          shasum -a 256 dist/OpenOutdoor-unsigned.ipa > dist/OpenOutdoor-unsigned.ipa.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-outdoor-unsigned-ios
          path: |
            dist/OpenOutdoor-unsigned.ipa
            dist/OpenOutdoor-unsigned.ipa.sha256
          retention-days: 1
          if-no-files-found: error
