name: macos-ios-build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ios:
    name: macos-ios-build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Select and verify pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "$(printf '%s\n' "$xcode_version" | sed -n '1s/Xcode //p')" = '27.1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26.12.1 }
      - shell: bash
        run: npm install --global pnpm@12.15.0
      - shell: bash
        run: pnpm install --frozen-lockfile
      - name: Verify native signed-update trust
        # Exercises the same CryptoKit/Keychain trust implementation using synthetic in-memory persistence.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/laptop-native
          node --test tools/test/laptop-native-errors.test.mjs
          swiftc packages/native-spikes/ios/OpenOutdoorLaptopEndpoint.swift tools/laptop/laptop-endpoint-native-tests.swift -o .scratch/laptop-native/endpoint-tests
          .scratch/laptop-native/endpoint-tests
          node tools/laptop/laptop-update-test-vectors.mjs > .scratch/laptop-native/vectors.json
          swiftc packages/native-spikes/ios/OpenOutdoorStateUpdateTrust.swift tools/laptop/laptop-update-native-tests.swift -o .scratch/laptop-native/trust-tests
          .scratch/laptop-native/trust-tests .scratch/laptop-native/vectors.json
      - name: Build unsigned device application
        shell: bash
        run: pwsh -NoProfile -File scripts/Build-IosUnsigned.ps1
      - name: Package unsigned application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          app="$(find dist/ios-derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          cp -R "$app" dist/Payload/
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/OpenOutdoor-unsigned.ipa
          shasum -a 256 dist/OpenOutdoor-unsigned.ipa > dist/OpenOutdoor-unsigned.ipa.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-outdoor-unsigned-ios
          path: |
            dist/OpenOutdoor-unsigned.ipa
            dist/OpenOutdoor-unsigned.ipa.sha256
          retention-days: 1
          if-no-files-found: error
