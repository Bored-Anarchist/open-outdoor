name: design-accessibility-traceability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-accessibility-traceability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: design-accessibility-traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - shell: bash
        run: |
          set -euo pipefail
          test -s docs/ACCESSIBILITY_STANDARD.md
          test -s docs/REQUIREMENTS_TRACEABILITY.md
          test -s docs/TEST_AND_ACCEPTANCE_PLAN.md
