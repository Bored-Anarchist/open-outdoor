name: design-accessibility-traceability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-accessibility-traceability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: design-accessibility-traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - shell: bash
        run: |
          set -euo pipefail
          test -s docs/ACCESSIBILITY_STANDARD.md
          test -s docs/REQUIREMENTS_TRACEABILITY.md
          test -s docs/TEST_AND_ACCEPTANCE_PLAN.md
      - id: design
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)"
          if grep -Eq '^(apps/|packages/(shared|map)/|tools/design-browser-qa.mjs|package.json|pnpm-lock.yaml|.github/workflows/design-accessibility-traceability.yml)' <<<"$changed"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.design.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24.19.0 }
      - if: steps.design.outputs.run == 'true'
        shell: bash
        run: npm install --global pnpm@11.20.0
      - if: steps.design.outputs.run == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile
      - if: steps.design.outputs.run == 'true'
        shell: bash
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.design.outputs.run == 'true'
        shell: bash
        run: pnpm test:design:browser
