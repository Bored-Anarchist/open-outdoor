name: documentation-integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation-integrity:
    name: documentation-integrity
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate WP-001 governance controls
        shell: pwsh
        run: ./scripts/Test-Wp001.ps1
