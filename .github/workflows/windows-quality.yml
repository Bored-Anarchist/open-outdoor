name: windows-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route quality checks
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      run_expensive: ${{ steps.route.outputs.run_expensive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - id: route
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)"
          if grep -Eq '^(apps|packages|tools|scripts|config|fixtures|python)/|^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|pyproject.toml|uv.lock|tsconfig)' <<<"$changed"; then
            echo 'run_expensive=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_expensive=false' >> "$GITHUB_OUTPUT"
          fi
  windows-shared:
    name: Windows shared checks
    needs: route
    if: needs.route.outputs.run_expensive == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26.12.1 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: 3.15.1 }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - shell: pwsh
        run: npm install --global pnpm@12.15.0
      - shell: pwsh
        run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: pnpm quality
      - shell: pwsh
        run: uv run --frozen --group loader python -m unittest discover -s python/tests
  quality:
    name: windows-quality
    needs: [route, windows-shared]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Require the routed quality checks to succeed
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          RUN_EXPENSIVE: ${{ needs.route.outputs.run_expensive }}
          QUALITY_RESULT: ${{ needs.windows-shared.result }}
        run: |
          set -euo pipefail
          test "$ROUTE_RESULT" = success
          if [ "$RUN_EXPENSIVE" = true ]; then
            test "$QUALITY_RESULT" = success
          else
            test "$RUN_EXPENSIVE" = false
            test "$QUALITY_RESULT" = skipped
          fi
