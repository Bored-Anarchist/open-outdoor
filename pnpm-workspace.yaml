packages:
  - apps/*
  - packages/*

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@open-outdoor/*'

strictPeerDependencies: true

# Security patches for dependencies whose parents still pin older versions.
# Metro 0.84.6 removes image-size rather than changing its API under old callers.
# xcode uses uuid.v4(), which remains CommonJS-compatible in uuid 11.
overrides:
  '@xmldom/xmldom@<0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'metro@0.84.4': 0.84.6
  'xcode@3.0.1>uuid': 11.1.1
