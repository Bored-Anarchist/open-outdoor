packages:
  - apps/*
  - packages/*

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@open-outdoor/*'

strictPeerDependencies: true

# Security patches for dependencies whose parents still pin older versions.
# Expo 58 already resolves Metro 0.87 and xcode 4 without the old compatibility overrides.
overrides:
  '@xmldom/xmldom@<0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
